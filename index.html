<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloody Engine - Triangle Rendering</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #1a1a1a;
        font-family: monospace;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      canvas {
        border: 2px solid #444;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        background: #0a0a0a;
      }

      .info {
        color: #aaa;
        text-align: center;
        font-size: 14px;
        line-height: 1.6;
      }

      .info strong {
        color: #fff;
      }

      #log {
        position: absolute;
        bottom: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.9);
        color: #0f0;
        padding: 15px;
        border: 1px solid #0f0;
        font-size: 12px;
        max-width: 400px;
        max-height: 200px;
        overflow-y: auto;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 style="color: #aaa; margin: 0">🩸 Bloody Engine</h1>
      <canvas id="canvas" width="800" height="600"></canvas>
      <div class="info">
        <strong>RGB Gradient Triangle</strong><br />
        Demonstrating WebGL rendering abstraction
      </div>
    </div>

    <div id="log"></div>

    <script type="module">
      // Simple logging to UI
      const logEl = document.getElementById("log");
      const originalLog = console.log;
      const logs = [];

      console.log = function (...args) {
        originalLog(...args);
        const message = args.join(" ");
        logs.push(message);
        if (logs.length > 10) logs.shift();
        logEl.innerHTML = logs.map((l) => l + "<br>").join("");
      };

      // ============================================
      // Simple Triangle Rendering Test
      // ============================================
      console.log("🎨 Bloody Engine initialized!");

      const canvas = document.getElementById("canvas");
      const gl = canvas.getContext("webgl");

      if (!gl) {
        console.log("✗ WebGL not supported");
        document.body.innerHTML = "<h1>WebGL not supported</h1>";
        process.exit(1);
      }

      console.log(`✓ WebGL context created`);
      console.log(`✓ Canvas: ${canvas.width}x${canvas.height}`);

      // Define a simple triangle with position and color
      const triangleVertices = new Float32Array([
        // Position (x, y, z)    Color (r, g, b)
        0.0,
        0.5,
        0.0,
        1.0,
        0.0,
        0.0, // Top vertex - Red
        -0.5,
        -0.5,
        0.0,
        0.0,
        1.0,
        0.0, // Bottom left - Green
        0.5,
        -0.5,
        0.0,
        0.0,
        0.0,
        1.0, // Bottom right - Blue
      ]);

      // Vertex shader
      const vertexShaderSource = `
            attribute vec3 aPosition;
            attribute vec3 aColor;

            varying vec3 vColor;

            void main() {
                gl_Position = vec4(aPosition, 1.0);
                vColor = aColor;
            }
        `;

      // Fragment shader
      const fragmentShaderSource = `
            precision highp float;
            varying vec3 vColor;

            void main() {
                gl_FragColor = vec4(vColor, 1.0);
            }
        `;

      // Compile shader
      function compileShader(source, type) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);

        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.log("✗ Shader compile error:", gl.getShaderInfoLog(shader));
          gl.deleteShader(shader);
          return null;
        }
        return shader;
      }

      // Link program
      function linkProgram(vertexShader, fragmentShader) {
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          console.log("✗ Program link error:", gl.getProgramInfoLog(program));
          gl.deleteProgram(program);
          return null;
        }
        return program;
      }

      try {
        // Create shader
        const vertexShader = compileShader(
          vertexShaderSource,
          gl.VERTEX_SHADER,
        );
        const fragmentShader = compileShader(
          fragmentShaderSource,
          gl.FRAGMENT_SHADER,
        );
        const program = linkProgram(vertexShader, fragmentShader);

        if (!program) throw new Error("Failed to create program");
        console.log("✓ Shader compiled and linked");

        // Create vertex buffer
        const vertexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, triangleVertices, gl.STATIC_DRAW);
        console.log("✓ Vertex buffer created");

        // Get attribute locations
        const positionAttr = gl.getAttribLocation(program, "aPosition");
        const colorAttr = gl.getAttribLocation(program, "aColor");
        console.log("✓ Attributes located");

        // Activate shader
        gl.useProgram(program);
        console.log("✓ Shader activated");

        // Setup vertex attribute pointers
        const stride = 6 * 4;

        gl.enableVertexAttribArray(positionAttr);
        gl.vertexAttribPointer(positionAttr, 3, gl.FLOAT, false, stride, 0);

        gl.enableVertexAttribArray(colorAttr);
        gl.vertexAttribPointer(colorAttr, 3, gl.FLOAT, false, stride, 3 * 4);

        console.log("✓ Vertex attributes configured");

        // Clear the screen
        gl.clearColor(0.1, 0.1, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        console.log("✓ Screen cleared");

        // Draw the triangle
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        console.log("✓ Triangle rendered!");

        // Cleanup
        gl.deleteBuffer(vertexBuffer);
        gl.deleteShader(vertexShader);
        gl.deleteShader(fragmentShader);
        gl.deleteProgram(program);
        console.log("✓ Resources cleaned up");
      } catch (error) {
        console.log("✗ Rendering failed:", error.message);
      }

      console.log("✓ Done!");
    </script>
  </body>
</html>
