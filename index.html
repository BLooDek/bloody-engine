<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🩸 Bloody Engine - Browser Renderer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0a0a0a;
        color: #aaa;
        font-family: monospace;
        padding: 20px;
      }

      h1 {
        color: #fff;
        text-align: center;
        margin-bottom: 20px;
      }

      canvas {
        display: block;
        margin: 0 auto;
        border: 2px solid #333;
        background: #1a1a1a;
      }

      #info {
        text-align: center;
        margin-top: 10px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import("./src/core/index.js").catch((err) => {
        console.error("Failed to load renderer:", err);
        document.body.innerHTML += `<p style="color: red;">Failed to load renderer: ${err.message}</p>`;
      });
    </script>
  </body>
</html>
